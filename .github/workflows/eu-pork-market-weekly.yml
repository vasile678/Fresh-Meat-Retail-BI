name: EU Pork Market Weekly - Scheduled Thursday Pipeline

on:
  schedule:
    # Rulează joi pentru colectare automată la 09:00, 14:00 și 16:00 Europe/Bucharest.
    # Acoperă atât ora de vară (UTC+3) cât și ora de iarnă (UTC+2) pentru a asigura sincronizarea
    # cu sesiunile de închidere ale burselor (inclusiv Mercolleida ~13:00 CET și CUN ~11:00 CET).
    - cron: '0 6,7,11,12,13,14 * * 4'
  workflow_dispatch:
    inputs:
      week:
        description: "Săptămâna ISO de procesat (ex: WK44, WK45). Lăsați gol pentru săptămâna curentă."
        required: false
        default: ""
      year:
        description: "Anul calendaristic (ex: 2026). Lăsați gol pentru anul curent."
        required: false
        default: ""
      dataset_path:
        description: "Calea către datasetul autoritativ EU Pork Market (lăsați gol pentru convenția automată)"
        required: false
        default: ""
      source_path:
        description: "Calea către chitanța SOURCE_VERIFICATION (lăsați gol pentru convenția automată)"
        required: false
        default: ""
      visual_path:
        description: "Calea către chitanța VISUAL_QA (lăsați gol pentru convenția automată)"
        required: false
        default: ""
      publish:
        description: "Publică atomic rezultatele în dashboard (doar la RELEASE_PASS)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  eu-pork-weekly:
    name: Execute EU Pork Market Weekly Controlled Pipeline
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.commit_push.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check Europe/Bucharest Local Time (09:00, 14:00, 16:00)
        id: time_check
        run: |
          python3 -c "
          import datetime, zoneinfo, os, sys
          tz = zoneinfo.ZoneInfo('Europe/Bucharest')
          now = datetime.datetime.now(tz)
          hour = now.hour
          minute = now.minute
          is_forced = '${{ github.event_name }}' in ['workflow_dispatch', 'repository_dispatch']
          print(f'Ora locală în Europe/Bucharest: {now.strftime(\"%Y-%m-%d %H:%M:%S\")} (ora: {hour}, minut: {minute})')

          should_run = False
          if is_forced:
              print('Execuție manuală solicitată (workflow_dispatch). Se continuă verificarea.')
              should_run = True
          elif hour in [9, 14, 16]:
              print(f'Fereastra programată {hour}:00 Europe/Bucharest confirmată (colectare sesiune bursă).')
              should_run = True
          else:
              print(f'În afara ferestrelor programate de 09:00, 14:00, 16:00 Europe/Bucharest (ora curentă {hour}:{minute:02d}). Se omite acest trigger orar.')

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'SHOULD_RUN={\"true\" if should_run else \"false\"}\n')
          "

      - name: Setup Python
        if: env.SHOULD_RUN == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'fresh_meat_bi/requirements.txt'

      - name: Install system fonts
        if: env.SHOULD_RUN == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install Python dependencies
        if: env.SHOULD_RUN == 'true'
        run: pip install -r fresh_meat_bi/requirements.txt

      - name: Resolve Target ISO Week and Year
        id: resolve_target
        if: env.SHOULD_RUN == 'true'
        run: |
          WEEK_INPUT="${{ inputs.week }}"
          YEAR_INPUT="${{ inputs.year }}"
          
          if [ -z "$WEEK_INPUT" ] || [ -z "$YEAR_INPUT" ]; then
            CAL_INFO=$(python3 -c "
          import datetime, zoneinfo
          tz = zoneinfo.ZoneInfo('Europe/Bucharest')
          now = datetime.datetime.now(tz)
          iso_year, iso_week, _ = now.isocalendar()
          print(f'WK{iso_week:02d} {iso_year}')
          ")
            AUTO_WEEK=$(echo $CAL_INFO | cut -d' ' -f1)
            AUTO_YEAR=$(echo $CAL_INFO | cut -d' ' -f2)
            TARGET_WEEK="${WEEK_INPUT:-$AUTO_WEEK}"
            TARGET_YEAR="${YEAR_INPUT:-$AUTO_YEAR}"
          else
            TARGET_WEEK="$WEEK_INPUT"
            TARGET_YEAR="$YEAR_INPUT"
          fi
          
          echo "target_week=$TARGET_WEEK" >> $GITHUB_OUTPUT
          echo "target_year=$TARGET_YEAR" >> $GITHUB_OUTPUT
          echo "TARGET_WEEK=$TARGET_WEEK" >> $GITHUB_ENV
          echo "TARGET_YEAR=$TARGET_YEAR" >> $GITHUB_ENV

      - name: Run Autonomous Multi-Source EU Pork Collector
        id: run_collector
        if: env.SHOULD_RUN == 'true'
        run: |
          echo "======================================================="
          echo "Pornire colector autonom pentru cele 8 piețe europene de referință..."
          echo "Săptămâna țintă: $TARGET_WEEK / $TARGET_YEAR"
          echo "======================================================="
          python3 fresh_meat_bi/eu_pork_collector.py --week "$TARGET_WEEK" --year "$TARGET_YEAR" || true

      - name: Check Verified Prerequisites (FAIL_CLOSED)
        id: resolve_prereqs
        if: env.SHOULD_RUN == 'true'
        run: |
          # Rezolvare căi fișiere dataset și chitanțe (fără presupuneri statice)
          DATASET="${{ inputs.dataset_path }}"
          [ -z "$DATASET" ] && DATASET="fresh_meat_bi/EU_PORK_MARKET_DATASET_${TARGET_WEEK}.json"
          
          SOURCE="${{ inputs.source_path }}"
          [ -z "$SOURCE" ] && SOURCE="fresh_meat_bi/EU_SOURCE_RECEIPT_${TARGET_WEEK}.json"
          
          VISUAL="${{ inputs.visual_path }}"
          [ -z "$VISUAL" ] && VISUAL="fresh_meat_bi/EU_VISUAL_RECEIPT_${TARGET_WEEK}.json"
          
          echo "DATASET_PATH=$DATASET" >> $GITHUB_ENV
          echo "SOURCE_PATH=$SOURCE" >> $GITHUB_ENV
          echo "VISUAL_PATH=$VISUAL" >> $GITHUB_ENV
          
          echo "======================================================="
          echo "Verificare premise EU Pork Market pentru $TARGET_WEEK / $TARGET_YEAR:"
          echo " - Dataset: $DATASET"
          echo " - Sursă: $SOURCE"
          echo " - Vizual: $VISUAL"
          echo "======================================================="
          
          PREREQS_MET=true
          if [ ! -f "$DATASET" ]; then
            echo "[LIPSĂ PREMISĂ] Datasetul $DATASET nu există."
            PREREQS_MET=false
          fi
          if [ ! -f "$SOURCE" ]; then
            echo "[LIPSĂ PREMISĂ] Chitanța de verificare $SOURCE nu există."
            PREREQS_MET=false
          fi
          if [ ! -f "$VISUAL" ]; then
            echo "[LIPSĂ PREMISĂ] Chitanța vizuală $VISUAL nu există."
            PREREQS_MET=false
          fi
          
          if [ "$PREREQS_MET" = "true" ]; then
            echo "Toate premisele verificate pentru $TARGET_WEEK sunt prezente. Se continuă execuția pipeline-ului."
            echo "PREREQS_MET=true" >> $GITHUB_ENV
          else
            echo "======================================================="
            echo "[FAIL_CLOSED ACTIVAT]: Datele verificate pentru săptămâna $TARGET_WEEK lipsesc."
            echo "Datele necesită validare oficială per specificația benchmark din EU_PORK_MARKET_CONFIG.json."
            echo "Conform politicii anti-ficțiune FAIL_CLOSED, raportul oficial anterior din producție rămâne conservat 100% intact."
            echo "======================================================="
            echo "PREREQS_MET=false" >> $GITHUB_ENV
          fi

      - name: Validate Dataset Consistency & Anti-Stale Guard (FAIL_CLOSED)
        if: env.SHOULD_RUN == 'true' && env.PREREQS_MET == 'true'
        run: |
          python3 -c "
          import json, datetime, sys, os
          from pathlib import Path

          target_week = os.environ['TARGET_WEEK']
          target_year = int(os.environ['TARGET_YEAR'])
          w_num = int(target_week.replace('WK', ''))
          d_mon = datetime.date.fromisocalendar(target_year, w_num, 1)
          d_sun = datetime.date.fromisocalendar(target_year, w_num, 7)
          expected_period = f'{d_mon.strftime(\"%d.%m\")}–{d_sun.strftime(\"%d.%m.%Y\")}'

          ds_path = Path(os.environ['DATASET_PATH'])
          ds = json.loads(ds_path.read_text(encoding='utf-8'))
          if ds.get('period') != expected_period:
              print(f'[FAIL_CLOSED ERROR] Dataset period {ds.get(\"period\")} != expected {expected_period}')
              sys.exit(1)
          if ds.get('week') != target_week:
              print(f'[FAIL_CLOSED ERROR] Dataset week {ds.get(\"week\")} != expected {target_week}')
              sys.exit(1)
          if target_week == 'WK46' and ('02.11' in ds.get('period', '') or ds.get('updated') == '05.11.2026'):
              print(f'[FAIL_CLOSED ERROR] Stale WK45 timestamps detected in WK46 dataset: {ds.get(\"period\")}')
              sys.exit(1)
          print(f'✓ Dataset {target_week} period {expected_period} verified.')
          "

      - name: Run EU Pork Module Verification Tests
        if: env.SHOULD_RUN == 'true' && env.PREREQS_MET == 'true'
        run: |
          python3 fresh_meat_bi/test_eu_pork_module.py

      - name: Execute Full Weekly Pipeline with Release Gate & Staging
        if: env.SHOULD_RUN == 'true' && env.PREREQS_MET == 'true'
        run: |
          python3 fresh_meat_bi/weekly_pipeline.py \
            --week "$TARGET_WEEK" \
            --year "$TARGET_YEAR" \
            --domain EU_PORK_MARKET \
            --dataset "$DATASET_PATH" \
            --source "$SOURCE_PATH" \
            --visual "$VISUAL_PATH" \
            --publish

      - name: Update Unified Market Intelligence Manifest
        if: env.SHOULD_RUN == 'true' && env.PREREQS_MET == 'true'
        run: |
          python3 fresh_meat_bi/update_market_intelligence_manifest.py

      - name: Strict Verification of Published Assets & Release Gate (FAIL_CLOSED)
        if: env.SHOULD_RUN == 'true' && env.PREREQS_MET == 'true'
        run: |
          python3 -c "
          import json, datetime, sys, os, hashlib
          from pathlib import Path
          from PIL import Image

          target_week = os.environ['TARGET_WEEK']
          target_year = int(os.environ['TARGET_YEAR'])
          w_num = int(target_week.replace('WK', ''))
          d_mon = datetime.date.fromisocalendar(target_year, w_num, 1)
          d_sun = datetime.date.fromisocalendar(target_year, w_num, 7)
          expected_period = f'{d_mon.strftime(\"%d.%m\")}–{d_sun.strftime(\"%d.%m.%Y\")}'

          # 1. Verify export JSON
          exp_path = Path('public/data/eu_pork_market_export.json')
          assert exp_path.exists(), 'Export file missing'
          exp = json.loads(exp_path.read_text(encoding='utf-8'))
          assert exp.get('release_status') == 'RELEASE_PASS', f'Status must be RELEASE_PASS, got {exp.get(\"release_status\")}'
          assert exp.get('week') == target_week, f'Week mismatch: expected {target_week}, got {exp.get(\"week\")}'
          assert exp.get('year') == target_year, f'Year mismatch: expected {target_year}, got {exp.get(\"year\")}'
          assert exp.get('period') == expected_period, f'Period mismatch: expected {expected_period}, got {exp.get(\"period\")}'
          assert len(exp.get('rows', [])) == 8, f'Expected 8 canonical markets, got {len(exp.get(\"rows\", []))}'

          # Anti-stale check: reject WK45 dates in WK46
          if target_week == 'WK46':
              assert '02.11' not in exp.get('period', ''), 'Stale WK45 period in WK46'
              assert exp.get('updated') != '05.11.2026', 'Stale WK45 update date in WK46'

          # 2. Verify published PNG image
          img_path = Path(f'public/EU_PORK_MARKET_{target_week}_{target_year}.png')
          assert img_path.exists(), f'Published PNG {img_path} missing'
          assert img_path.stat().st_size > 500000, f'Published PNG is too small or corrupt: {img_path.stat().st_size} bytes'
          im = Image.open(img_path)
          assert im.size == (1536, 1024), f'Image dimensions must be 1536x1024, got {im.size}'

          # 3. Verify manifest synchronization
          mf_path = Path('public/data/market_intelligence_manifest.json')
          assert mf_path.exists(), 'Manifest missing'
          mf = json.loads(mf_path.read_text(encoding='utf-8'))
          eu_mf = mf.get('modules', {}).get('eu_pork_market', {})
          assert eu_mf.get('week') == target_week, 'Manifest week mismatch'
          assert eu_mf.get('period') == expected_period, 'Manifest period mismatch'
          assert eu_mf.get('status') == 'RELEASE_PASS', 'Manifest status mismatch'
          
          exp_sha = hashlib.sha256(exp_path.read_bytes()).hexdigest()
          assert eu_mf.get('dataset_sha256') == exp_sha, f'Manifest dataset_sha256 mismatch: expected {exp_sha}, got {eu_mf.get(\"dataset_sha256\")}'

          print(f'✓ All strict verification checks passed: {target_week} {expected_period} RELEASE_PASS (100% verified)')
          "

      - name: Commit and Push Updated EU Pork Market Release
        id: commit_push
        if: env.SHOULD_RUN == 'true' && env.PREREQS_MET == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/eu_pork_market_export.json \
                  public/EU_PORK_MARKET_*.png \
                  public/data/market_intelligence_manifest.json \
                  fresh_meat_bi/EU_PORK_MARKET_DATASET_${TARGET_WEEK}.json \
                  fresh_meat_bi/EU_SOURCE_RECEIPT_${TARGET_WEEK}.json \
                  fresh_meat_bi/EU_VISUAL_RECEIPT_${TARGET_WEEK}.json
          
          if git diff --staged --quiet; then
            echo "Nicio modificare nouă detectată în dataset. Raportul este la zi."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(eu-pork): Weekly 09:00 Europe/Bucharest release publication ($TARGET_WEEK) [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "Modificările au fost publicate în main."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  deploy-pages:
    name: Build & Deploy Updated Release to GitHub Pages
    needs: [eu-pork-weekly]
    if: needs.eu-pork-weekly.outputs.has_changes == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: '/Fresh-Meat-Retail-BI/'

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/data/eu_pork_market_export.json
          test -f dist/data/market_intelligence_manifest.json
          echo "EU Pork Market build and distribution verified successfully"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


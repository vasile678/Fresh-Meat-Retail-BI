name: Fresh Meat BI - Weekly Controlled Pipeline

on:
  schedule:
    # Rulează în fiecare luni la 06:00, 07:00 și 08:00 UTC (EET / EEST).
    # Acoperă exact 09:00 Europe/Bucharest și tolerează întârzierile de coadă GitHub Actions.
    - cron: '0 6,7,8 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: "Săptămâna ISO (ex: WK45). Lăsați gol pentru determinare automată dinamică conform calendarului."
        required: false
        default: ""
      year:
        description: "Anul calendaristic (ex: 2026). Lăsați gol pentru anul curent."
        required: false
        default: ""
      domain:
        description: "Domeniul de analiză"
        required: true
        type: choice
        options:
          - PROMO
          - EU_PORK_MARKET
        default: PROMO
      dataset_path:
        description: "Calea către fișierul DATASET / LOCK (opțional - generat autonom dacă lipsește)"
        required: false
        default: ""
      publish:
        description: "Publică atomic rezultatele în dashboard (doar la RELEASE_PASS)"
        required: true
        type: boolean
        default: true

concurrency:
  group: fresh-meat-promo-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly-pipeline:
    name: Execute Weekly Controlled Pipeline
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'fresh_meat_bi/requirements.txt'

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r fresh_meat_bi/requirements.txt

      - name: Evaluate Schedule & Recovery Window (Europe/Bucharest)
        id: scheduler_check
        run: |
          IS_DUE=$(python3 fresh_meat_bi/promo_weekly_scheduler.py --is-due)
          TARGET_WEEK=$(python3 fresh_meat_bi/promo_weekly_scheduler.py --get-target-week)
          echo "Target week in Europe/Bucharest is: $TARGET_WEEK"
          echo "Is release update due: $IS_DUE"
          echo "is_due=$IS_DUE" >> $GITHUB_OUTPUT
          echo "target_week=$TARGET_WEEK" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$IS_DUE" != "true" ]; then
            echo "SHOULD_RUN=false" >> $GITHUB_ENV
            echo "Current target week ($TARGET_WEEK) is already active and verified or scheduled time not reached. Skipping redundant run."
          else
            echo "SHOULD_RUN=true" >> $GITHUB_ENV
            echo "Pipeline will execute for week: $TARGET_WEEK"
          fi

      - name: Run Weekly Pipeline Control Suite (Integrity & Security Gates)
        if: env.SHOULD_RUN == 'true'
        run: |
          python3 fresh_meat_bi/test_weekly_pipeline.py
          python3 fresh_meat_bi/promo_weekly_scheduler.py --test

      - name: Execute Autonomous Pipeline (Scheduled or Dynamic Dispatch)
        if: env.SHOULD_RUN == 'true' && (github.event_name == 'schedule' || inputs.week == '')
        run: |
          echo "Executing end-to-end autonomous collection, 25/25 audit, validation and atomic release..."
          python3 fresh_meat_bi/promo_weekly_scheduler.py --run-autonomous

      - name: Execute Controlled Pipeline (Manual Explicit Inputs)
        if: github.event_name == 'workflow_dispatch' && inputs.week != ''
        run: |
          WEEK="${{ inputs.week }}"
          YEAR="${{ inputs.year || '2026' }}"
          DOMAIN="${{ inputs.domain || 'PROMO' }}"
          DATASET="${{ inputs.dataset_path || format('fresh_meat_bi/PROMO_WEEKLY_CANONICAL_LOCK_{0}.json', inputs.week) }}"
          ARGS="--week $WEEK --year $YEAR --domain $DOMAIN --dataset $DATASET"
          
          if [ "${{ inputs.publish }}" = "true" ]; then
            ARGS="$ARGS --publish"
          fi

          echo "Running controlled pipeline with manual inputs: $ARGS"
          python3 fresh_meat_bi/weekly_pipeline.py $ARGS
          python3 fresh_meat_bi/update_market_intelligence_manifest.py

      - name: Verify Observability & Published Status
        if: env.SHOULD_RUN == 'true'
        run: |
          test -f public/data/active_release.json
          test -f public/data/schedule_status.json
          test -f public/data/market_intelligence_manifest.json
          echo "Release manifest & schedule status successfully verified."

      - name: Commit & Push to Repository (Atomic Production Persistence)
        if: env.SHOULD_RUN == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/ releases/ fresh_meat_bi/*.json
          if git diff --staged --quiet; then
            echo "No changes staged. Preserved existing production release unchanged."
          else
            git commit -m "chore(bi): automated weekly market intelligence release [skip ci]"
            git push origin main
            echo "Successfully persisted release update to origin main."
          fi

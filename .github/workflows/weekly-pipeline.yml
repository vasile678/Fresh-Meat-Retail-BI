name: Fresh Meat BI - Weekly Controlled Pipeline

on:
  schedule:
    # Rulează în fiecare luni la 06:00, 07:00, 08:00, 09:00, 10:00, 12:00, 14:00 UTC (EET / EEST).
    # Acoperă 08:00, 09:00, 10:00, 11:00, 12:00, 14:00, 16:00 Europe/Bucharest cu recuperare automată a întârzierilor.
    # Include de asemenea verificări zilnice de recuperare marți–vineri la 07:00 UTC dacă săptămâna activă este în urmă.
    - cron: '0 6,7,8,9,10,12,14 * * 1'
    - cron: '0 7 * * 2-5'
  workflow_dispatch:
    inputs:
      week:
        description: "Săptămâna ISO (ex: WK46). Lăsați gol pentru determinare automată dinamică conform calendarului."
        required: false
        default: ""
      year:
        description: "Anul calendaristic (ex: 2026). Lăsați gol pentru anul curent."
        required: false
        default: ""
      domain:
        description: "Domeniul de analiză"
        required: true
        type: choice
        options:
          - PROMO
          - EU_PORK_MARKET
        default: PROMO
      dataset_path:
        description: "Calea către fișierul DATASET / LOCK (opțional - generat autonom dacă lipsește)"
        required: false
        default: ""
      publish:
        description: "Publică atomic rezultatele în dashboard (doar la RELEASE_PASS)"
        required: true
        type: boolean
        default: true

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  weekly-pipeline:
    name: Execute Weekly Controlled Pipeline
    runs-on: ubuntu-24.04
    outputs:
      has_changes: ${{ steps.commit_push.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'fresh_meat_bi/requirements.txt'

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install -r fresh_meat_bi/requirements.txt

      - name: Evaluate Schedule & Recovery Window (Europe/Bucharest)
        id: scheduler_check
        run: |
          IS_DUE=$(python3 fresh_meat_bi/promo_weekly_scheduler.py --is-due)
          TARGET_WEEK=$(python3 fresh_meat_bi/promo_weekly_scheduler.py --get-target-week)
          echo "Target week in Europe/Bucharest is: $TARGET_WEEK"
          echo "Is release update due: $IS_DUE"
          echo "is_due=$IS_DUE" >> $GITHUB_OUTPUT
          echo "target_week=$TARGET_WEEK" >> $GITHUB_OUTPUT
          
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$IS_DUE" != "true" ]; then
            echo "SHOULD_RUN=false" >> $GITHUB_ENV
            echo "Current target week ($TARGET_WEEK) is already active and verified or scheduled time not reached. Skipping redundant run."
          else
            echo "SHOULD_RUN=true" >> $GITHUB_ENV
            echo "Pipeline will execute for week: $TARGET_WEEK"
          fi

      - name: Run Weekly Pipeline Control Suite (Integrity & Security Gates)
        if: env.SHOULD_RUN == 'true'
        run: |
          python3 fresh_meat_bi/test_weekly_pipeline.py
          python3 fresh_meat_bi/promo_weekly_scheduler.py --test
          python3 fresh_meat_bi/test_strategic_category_intelligence.py

      - name: Execute Autonomous Pipeline (Scheduled or Dynamic Dispatch)
        if: env.SHOULD_RUN == 'true' && (github.event_name == 'schedule' || inputs.week == '')
        run: |
          echo "Executing end-to-end autonomous collection, 25/25 audit, validation and atomic release..."
          python3 fresh_meat_bi/promo_weekly_scheduler.py --run-autonomous

      - name: Execute Controlled Pipeline (Manual Explicit Inputs)
        if: github.event_name == 'workflow_dispatch' && inputs.week != ''
        run: |
          WEEK="${{ inputs.week }}"
          YEAR="${{ inputs.year || '2026' }}"
          DOMAIN="${{ inputs.domain || 'PROMO' }}"
          DATASET="${{ inputs.dataset_path || format('fresh_meat_bi/PROMO_WEEKLY_CANONICAL_LOCK_{0}.json', inputs.week) }}"
          ARGS="--week $WEEK --year $YEAR --domain $DOMAIN --dataset $DATASET"
          
          if [ "${{ inputs.publish }}" = "true" ]; then
            ARGS="$ARGS --publish"
          fi

          echo "Running controlled pipeline with manual inputs: $ARGS"
          python3 fresh_meat_bi/weekly_pipeline.py $ARGS
          python3 fresh_meat_bi/update_market_intelligence_manifest.py

      - name: Verify Observability & Published Status
        if: env.SHOULD_RUN == 'true'
        run: |
          test -f public/data/active_release.json
          test -f public/data/schedule_status.json
          test -f public/data/market_intelligence_manifest.json
          echo "Release manifest & schedule status successfully verified."

      - name: Commit & Push to Repository (Atomic Production Persistence)
        id: commit_push
        if: env.SHOULD_RUN == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Inspect execution status
          ACTIVE_STATUS=""
          if [ -f "public/data/active_release.json" ]; then
            ACTIVE_STATUS=$(python3 -c "import json; print(json.load(open('public/data/active_release.json')).get('release_status', ''))")
          fi
          echo "Active Release Status: $ACTIVE_STATUS"

          # 2. Stage files based on execution status
          if [ "$ACTIVE_STATUS" = "RELEASE_PASS" ]; then
            echo "Release verified: Validating required published artifacts..."
            test -f "public/data/active_release.json" || { echo "Missing active_release.json"; exit 1; }
            test -f "public/data/bi_dashboard_export.json" || { echo "Missing bi_dashboard_export.json"; exit 1; }
            test -f "public/data/market_intelligence_manifest.json" || { echo "Missing market_intelligence_manifest.json"; exit 1; }
            
            # Stage verified release artifacts
            git add public/data/active_release.json
            git add public/data/bi_dashboard_export.json
            git add public/data/market_intelligence_manifest.json
            git add public/data/retail_media_export.json
            git add public/data/schedule_status.json
            [ -d "public/releases" ] && git add public/releases/
            for img in public/TOP5_PREȚURI_COMPETITORI_*.png; do
              [ -f "$img" ] && git add "$img"
            done
            
            # Stage candidate locks and receipts if they exist
            for f in fresh_meat_bi/PROMO_WEEKLY_CANONICAL_LOCK_*.json fresh_meat_bi/RESEARCH_RECEIPT_*.json fresh_meat_bi/RECONCILIATION_RECEIPT_*.json; do
              [ -f "$f" ] && git add "$f"
            done
            git add fresh_meat_bi/collector.py fresh_meat_bi/promo_weekly_scheduler.py fresh_meat_bi/update_market_intelligence_manifest.py
            COMMIT_MSG="chore(bi): automated weekly market intelligence release [skip ci]"
          else
            echo "Execution resulted in non-pass status (FAIL_CLOSED preserved)."
            # When FAIL_CLOSED, active_release.json MUST remain unmodified
            if [ -f "public/data/schedule_status.json" ]; then
              git add public/data/schedule_status.json
            fi
            COMMIT_MSG="chore(bi): update promo weekly schedule audit diagnosis [skip ci]"
          fi

          # 3. Check for staged changes
          if git diff --staged --quiet; then
            echo "No changes staged. Preserved existing production release unchanged."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 4. Commit and push with concurrency safety (no force push)
          echo "Committing staged updates..."
          git commit -m "$COMMIT_MSG"
          
          # Pull any remote updates without force pushing
          git pull --rebase origin main || true
          git push origin main
          echo "Successfully persisted updates to origin main."
          echo "has_changes=true" >> $GITHUB_OUTPUT

  deploy-pages:
    name: Build & Deploy Updated Release to GitHub Pages
    needs: [weekly-pipeline]
    if: needs.weekly-pipeline.outputs.has_changes == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_BASE_PATH: '/Fresh-Meat-Retail-BI/'

      - name: Verify build output & active release
        run: |
          test -d dist
          test -f dist/data/active_release.json
          test -f dist/data/bi_dashboard_export.json
          test -f dist/data/market_intelligence_manifest.json
          echo "Promo Weekly release distribution verified successfully"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
